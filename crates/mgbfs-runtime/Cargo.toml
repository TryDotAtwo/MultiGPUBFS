[package]
name = "mgbfs-runtime"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[features]
cuda = ["mgbfs-cuda/cuda"]
library-owner = ["mgbfs-cuda/library-owner"]

[dependencies]
mgbfs-core = { path = "../mgbfs-core" }
sha2 = "=0.10.8"
serde_json = "=1.0.138"
mgbfs-cuda = { path = "../mgbfs-cuda" }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "=0.2.189"

[[example]]
name = "single_gpu_bench"
required-features = ["cuda"]

[[example]]
name = "native_bench"
required-features = ["cuda"]

[[example]]
name = "macro_bench"
required-features = ["cuda"]

[[example]]
name = "distributed_smoke"
required-features = ["cuda"]

[[example]]
name = "distributed_bench"
required-features = ["cuda"]
