name: Python tuning regression checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Tuning and geometry regression checks
        run: |
          python3 -m unittest discover -s tests -p 'test_autotune*.py'
          python3 -m unittest discover -s tests -p 'test_size_profiles.py'
          python3 -m unittest discover -s tests -p 'test_hardware_profiles.py'
          python3 -m unittest discover -s tests -p 'test_workload_geometry.py'
          python3 -m unittest discover -s tests -p 'test_fast_start_policy.py'
