name: Driver diagnostic regression and loader fixtures
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Framework, classification and actual shared-library loader failures
        run: python3 -m unittest discover -s tests -p 'test*diagnostic*.py'
