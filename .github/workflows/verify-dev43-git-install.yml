name: Verify dev43 Git source install and prefetch
on:
  push:
    branches: [codex/capacity-policy-autotune]
    paths: [.github/workflows/verify-dev43-git-install.yml]
permissions:
  contents: read
jobs:
  install:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install direct from GitHub without CUDA toolkit
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0
          "$RUNNER_TEMP/venv/bin/python" -m pip install --upgrade "multigpubfs[cayleypy] @ git+https://github.com/TryDotAtwo/MultiGPUBFS.git@b8e1ddd3fbbebb88ff0c82cb063560397bdbfbf9"
          "$RUNNER_TEMP/venv/bin/python" - <<'PY'
          import importlib.metadata,json,pathlib,multigpubfs
          assert importlib.metadata.version('multigpubfs')=='0.2.0.dev43'
          root=pathlib.Path(multigpubfs.__file__).parent
          index=json.loads((root/'native_assets.json').read_text())
          info=json.loads((root/'_package_info.json').read_text())
          assert index['id']=='native-pip-20261121-v41'
          assert info['source_commit']=='b8e1ddd3fbbebb88ff0c82cb063560397bdbfbf9',info
          print('DIRECT_GIT_INSTALL_PASS',info['source_commit'])
          PY
      - name: Test online prefetch and offline reuse without GPUs
        env:
          CUDA_VISIBLE_DEVICES: ''
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/venv/bin/python" -m multigpubfs prefetch --sm 86 --cache "$RUNNER_TEMP/cache" --json > "$RUNNER_TEMP/online.json"
          MGBFS_NATIVE_OFFLINE=1 "$RUNNER_TEMP/venv/bin/python" -m multigpubfs prefetch --sm 86 --cache "$RUNNER_TEMP/cache" --json > "$RUNNER_TEMP/offline.json"
          "$RUNNER_TEMP/venv/bin/python" - "$RUNNER_TEMP/online.json" "$RUNNER_TEMP/offline.json" <<'PY'
          import json,pathlib,sys
          a,b=[json.loads(pathlib.Path(p).read_text()) for p in sys.argv[1:]]
          assert a['status']=='PREFETCHED' and not a['gpu_accessed'] and a['downloaded_bytes']==322989207,a
          assert b['status']=='PREFETCHED' and not b['gpu_accessed'] and b['downloaded_bytes']==0,b
          print('DIRECT_GIT_PREFETCH_PASS',a['downloaded_bytes'],b['downloaded_bytes'])
          PY
