name: Verify public native pip wheel
on:
  workflow_dispatch:
    inputs:
      wheel_url:
        required: true
      sha256:
        required: true
permissions:
  contents: read
jobs:
  clean-url-install:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      WHEEL_URL: ${{ inputs.wheel_url }}
      WHEEL_SHA: ${{ inputs.sha256 }}
      PIP_NO_CACHE_DIR: '1'
    steps:
      - name: Anonymous selective wheel readback and one-command extras install
        run: |
          python3 - <<'PY'
          import hashlib,json,os,re,subprocess,urllib.request,zipfile,textwrap
          from pathlib import Path
          url=os.environ['WHEEL_URL'];sha=os.environ['WHEEL_SHA']
          assert url.startswith('https://github.com/TryDotAtwo/MultiGPUBFS/releases/download/')
          assert re.fullmatch('[0-9a-f]{64}',sha)
          wheel=Path('/tmp/anonymous-readback.whl');urllib.request.urlretrieve(url,wheel)
          assert wheel.stat().st_size<2_000_000 and hashlib.sha256(wheel.read_bytes()).hexdigest()==sha
          with zipfile.ZipFile(wheel) as z:
              assert 'multigpubfs/native_assets.json' in z.namelist()
              assert not any(n.startswith('multigpubfs/_native/') for n in z.namelist())
              index=json.loads(z.read('multigpubfs/native_assets.json'))
              assert set(index['production'])=={'75','80','86','89','90','100','103','120','universal'}
          subprocess.run(['python3','-m','venv','/tmp/github-pip-clean'],check=True)
          python='/tmp/github-pip-clean/bin/python'
          subprocess.run([python,'-m','pip','install','multigpubfs[cayleypy] @ '+url+'#sha256='+sha],check=True)
          check="""import importlib.metadata,os,subprocess,urllib.request
          from unittest.mock import patch
          def forbidden(*args,**kwargs):raise AssertionError('Import must not probe GPU or download')
          with patch.object(subprocess,'Popen',side_effect=forbidden),patch.object(urllib.request,'urlopen',side_effect=forbidden):
              import multigpubfs
          import cayleypy
          from multigpubfs.native_assets import status,index_path
          assert importlib.metadata.version('multigpubfs')==os.environ['WHEEL_URL'].rsplit('/',1)[-1].split('-')[1]
          assert status()['status']=='NOT_PREPARED' and index_path().is_file()
          multigpubfs.enable_native()
          graph=cayleypy.CayleyGraph(cayleypy.PermutationGroups.lrx(5),device='cpu')
          assert status()['status']=='NOT_PREPARED'
          multigpubfs.disable_native()
          print('VERIFIED_PUBLIC_GITHUB_SMALL_WHEEL_EXTRAS_IMPORT_CPU_SAFE_NO_GPU')
          """
          subprocess.run([python,'-c',textwrap.dedent(check)],cwd='/tmp',check=True)
          subprocess.run([python,'-m','multigpubfs.diagnostics','--help'],check=True)
          subprocess.run([python,'-m','pip','check'],check=True)
          PY
