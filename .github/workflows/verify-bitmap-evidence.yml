name: Verify retained BFS layers
on:
  push:
    branches: ['codex/**', main]
    paths:
      - 'scripts/verify_bitmap_benchmark.py'
      - 'tests/test_verify_bitmap_benchmark.py'
      - '.github/workflows/verify-bitmap-evidence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retained-layer-contracts:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install test dependency
        run: python3 -m pip install 'pytest==8.3.5'
      - name: Check retained-layer comparison
        env:
          PYTHONPATH: .
        run: python3 -m pytest -q tests/test_verify_bitmap_benchmark.py
