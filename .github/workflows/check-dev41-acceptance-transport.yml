name: Check dev41 remote acceptance transport
on:
  push:
    branches: [codex/segmented-dev41-candidate]
    paths:
      - .github/workflows/check-dev41-acceptance-transport.yml
      - scripts/verify_installed_dev41_gpu.py
      - scripts/run_installed_dev41_acceptance.sh
permissions:
  contents: read
jobs:
  loopback-transport:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Exercise real SSH transport and success/failure capture
        run: |
          set -euo pipefail
          bash -n scripts/run_installed_dev41_acceptance.sh
          python3 -m py_compile scripts/verify_installed_dev41_gpu.py
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-server
          mkdir -p "$RUNNER_TEMP/ssh-test" "$RUNNER_TEMP/received"
          ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/ssh-test/client"
          ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/ssh-test/host"
          cp "$RUNNER_TEMP/ssh-test/client.pub" "$RUNNER_TEMP/ssh-test/authorized_keys"
          chmod 600 "$RUNNER_TEMP/ssh-test/authorized_keys"
          sudo mkdir -p /run/sshd
          sudo /usr/sbin/sshd -f /dev/null -p 22222 -h "$RUNNER_TEMP/ssh-test/host" \
            -o ListenAddress=127.0.0.1 \
            -o PidFile="$RUNNER_TEMP/ssh-test/sshd.pid" \
            -o AuthorizedKeysFile="$RUNNER_TEMP/ssh-test/authorized_keys" \
            -o PasswordAuthentication=no -o PermitRootLogin=no \
            -o StrictModes=no -o UsePAM=yes
          trap 'sudo kill "$(cat "$RUNNER_TEMP/ssh-test/sshd.pid")" 2>/dev/null || true' EXIT
          key="$RUNNER_TEMP/ssh-test/client"
          remote="$RUNNER_TEMP/ssh-test/remote"
          host="$(id -un)@127.0.0.1"
          opts=(-i "$key" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null)
          ssh "${opts[@]}" -p 22222 "$host" "mkdir -p '$remote/source'"
          git archive --format=tar -o "$RUNNER_TEMP/ssh-test/source.tar" HEAD
          scp "${opts[@]}" -P 22222 "$RUNNER_TEMP/ssh-test/source.tar" "$host:$remote/source.tar"
          ssh "${opts[@]}" -p 22222 "$host" "tar -xf '$remote/source.tar' -C '$remote/source'"
          for mode in synthetic-pass synthetic-fail; do
            set +e
            ssh "${opts[@]}" -p 22222 "$host" \
              "env MGBFS_ACCEPT_MODE='$mode' MGBFS_ACCEPT_ROOT='$remote/$mode' MGBFS_ACCEPT_ARCHIVE='$remote/$mode.tar.gz' MGBFS_ACCEPT_HARNESS='$remote/source/scripts/verify_installed_dev41_gpu.py' MGBFS_ACCEPT_SOURCE='$remote/source' MGBFS_ACCEPT_PYTHON=python3 bash '$remote/source/scripts/run_installed_dev41_acceptance.sh'"
            rc=$?
            set -e
            if [[ "$mode" == synthetic-pass && "$rc" != 0 ]]; then exit 80; fi
            if [[ "$mode" == synthetic-fail && "$rc" != 1 ]]; then exit 81; fi
            scp "${opts[@]}" -P 22222 "$host:$remote/$mode.tar.gz" "$RUNNER_TEMP/received/$mode.tar.gz"
          done
          python3 - "$RUNNER_TEMP/received" <<'PY'
          import json
          from pathlib import Path
          import sys
          import tarfile
          root=Path(sys.argv[1])
          for mode,status in [('synthetic-pass','PASS'),('synthetic-fail','FAIL')]:
              with tarfile.open(root/(mode+'.tar.gz'),'r:gz') as a:
                  names={m.name.removeprefix('./') for m in a}
                  required={'evidence/receipt.json','evidence/partial-evidence.txt',
                            'harness.log','system.txt','exit-code.txt'}
                  if not required.issubset(names):
                      raise AssertionError((mode,required-names))
                  receipt=json.load(a.extractfile('./evidence/receipt.json'))
                  if receipt['status']!=status:
                      raise AssertionError(receipt)
                  if mode=='synthetic-fail' and receipt.get('error')!='SYNTHETIC_INTENTIONAL_FAILURE':
                      raise AssertionError(receipt)
          print('SSH_TRANSPORT_SUCCESS_AND_FAILED_PARTIAL_EVIDENCE_PASS')
          PY
