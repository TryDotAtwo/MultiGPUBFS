name: Package and verify dev43 capacity tuning
on:
  push:
    branches: [codex/capacity-policy-autotune]
    paths: [.github/workflows/package-dev43-capacity.yml]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: b8e1ddd3fbbebb88ff0c82cb063560397bdbfbf9
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install CPU test and packaging tools
        run: |
          python -m pip install build pytest numpy packaging
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0
          python -m pip install cayleypy==0.2.0
      - name: Check capacity tuning and package contracts
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m pytest -q tests/test_segmented_capacity_policy.py tests/test_segmented_lane_autotune.py tests/test_segmented_exchange_autotune.py tests/test_autotune_policy.py tests/test_autotune_history.py tests/test_segmented_shard_policy.py tests/test_vram_release.py tests/test_segmented32_release.py tests/test_experimental_backend_capability.py tests/test_launch_cli.py tests/test_memory_preset.py tests/test_bitmap_owner_page_api.py tests/test_segment_strategy.py tests/test_tuning_evidence_retention.py
          python -c 'import json; a=json.load(open("multigpubfs/native_assets.json")); assert a["id"]=="native-pip-20261121-v41"; assert a["components"]["native-executable"]["files"]["bin/mgbfs"]["sha256"]=="10cb2e53915b9e8936582889445eed263cd6c370ab877aae0ee628fd8f2da687"'
      - name: Build the Python-only wheel around the accepted native index
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m scripts.build_lazy_native_package
          (cd dist-native && sha256sum -c SHA256SUMS)
          python -c 'import json; x=json.load(open("dist-native/manifest.json")); assert x["source_commit"]=="b8e1ddd3fbbebb88ff0c82cb063560397bdbfbf9"; assert x["wheel"]=="multigpubfs-0.2.0.dev43-py3-none-any.whl"; assert x["native_components"]=="native-pip-20261121-v41"'
      - name: Check wheel installation without GPUs
        run: |
          python -m venv /tmp/mgbfs-check
          /tmp/mgbfs-check/bin/pip install --no-deps dist-native/multigpubfs-0.2.0.dev43-py3-none-any.whl
          cd /tmp
          /tmp/mgbfs-check/bin/python -m multigpubfs --help
          /tmp/mgbfs-check/bin/python -c 'import importlib.metadata; assert importlib.metadata.version("multigpubfs")=="0.2.0.dev43"'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: multigpubfs-dev43-wheel-candidate
          path: dist-native/*
          if-no-files-found: error
          retention-days: 7
