name: Build and publish segmented strategies dev40
on:
  push:
    branches: [codex/integrated-bfs-best-practices-delivery]
    paths: [.github/workflows/build-segmented-strategies-dev40.yml]
permissions:
  contents: read
  actions: read
jobs:
  compile:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        sm: ["75", "80", "86", "89", "90", "100", "103", "120", "universal"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build g++ binutils
          python3 -m pip install packaging numpy
      - name: Verify target selection
        run: python3 -m unittest discover -s tests -p test_selective_build_diagnostics.py
      - name: Build source-pinned CUDA component
        env:
          MGBFS_DIAGNOSTIC_VARIANT: shared-sm120
          TARGET: ${{ matrix.sm }}
        run: |
          if [ "$TARGET" = universal ]; then
            unset MGBFS_TARGET_ARCH
          else
            export MGBFS_TARGET_ARCH="$TARGET"
          fi
          python3 scripts/build_portable_native.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: segmented-vram-sm${{ matrix.sm }}
          path: /tmp/mgbfs-portable/diagnostic-variant/shared-sm120/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
  publish:
    needs: compile
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      MGBFS_COMPONENT_BUILD_SOURCE: ${{ github.sha }}
      RELEASE_TAG: native-pip-20261121-v40
      WORKING_BRANCH: codex/integrated-bfs-best-practices-delivery
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install package tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y patchelf binutils
          python -m pip install build pytest numpy packaging
          rustup toolchain install 1.75.0 --profile minimal
      - name: Check configuration and packaging contracts
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_vram_release.py tests/test_segmented32_release.py tests/test_experimental_backend_capability.py tests/test_launch_cli.py tests/test_memory_preset.py
          PYTHONPATH=. python -m pytest -q tests/test_segment_strategy.py
          PYTHONPATH=. python -m pytest -q tests/test_segmented_shard_policy.py -k 'not custom_segment_rows_forwarded and not tuner'
      - name: Download matching component artifacts and shared runtime
        run: |
          for sm in 75 80 86 89 90 100 103 120; do
            gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "segmented-vram-sm$sm" --dir "/tmp/components/sm$sm"
          done
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name segmented-vram-smuniversal --dir /tmp/components/universal
          curl --fail --silent --show-error --location --retry 3 -o /tmp/common.tar.gz https://github.com/TryDotAtwo/MultiGPUBFS/releases/download/native-pip-20261019-v31/common-dev31.tar.gz
          echo '7d44d15a64d3032974801321420fda50027ce3724dba4d6d316cb759ffcb2c99  /tmp/common.tar.gz' | sha256sum -c -
          mkdir /tmp/common
          tar -xzf /tmp/common.tar.gz -C /tmp/common
      - name: Build and verify matching native components
        run: |
          PYTHONPATH=. python scripts/build_segmented_cli.py --cuda-dir /tmp/components/sm86 --common-dir /tmp/common --receipt /tmp/cli-receipt.json
          python -c 'import json; c=json.load(open("/tmp/cli-receipt.json"))["capabilities"]["segmented_strategies_v1"]; assert all(c.get(x) is True for x in ("atomic","warp","batch"))'
          PYTHONPATH=. python scripts/assemble_segmented_release.py --builds /tmp/components --binary target/release/mgbfs --binary-receipt /tmp/cli-receipt.json --output /tmp/segmented32-release --work /tmp/segmented32-work --tag "$RELEASE_TAG"
      - name: Assemble wheel and pin instructions
        run: |
          cp /tmp/segmented32-release/native-assets.json multigpubfs/native_assets.json
          python -c "from pathlib import Path; p=Path('pyproject.toml'); s=p.read_text(); a='version = \"0.2.0.dev39\"'; assert s.count(a)==1; p.write_text(s.replace(a, 'version = \"0.2.0.dev40\"'))"
          PYTHONPATH=. python -m scripts.build_lazy_native_package
          cp dist-native/*.whl /tmp/segmented32-release/
          cp dist-native/manifest.json /tmp/segmented32-release/wheel-manifest.json
          python scripts/finalize_strategy_release.py --wheel dist-native/multigpubfs-0.2.0.dev40-py3-none-any.whl
          (cd /tmp/segmented32-release && sha256sum * > SHA256SUMS && sha256sum -c SHA256SUMS)
      - name: Check candidate wheel without GPU
        run: |
          python -m venv /tmp/check-wheel
          /tmp/check-wheel/bin/pip install --no-deps dist-native/multigpubfs-0.2.0.dev40-py3-none-any.whl
          cd /tmp
          /tmp/check-wheel/bin/python -m multigpubfs --help
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: segmented-vram-dev40-release
          path: /tmp/segmented32-release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Publish prerelease and fast-forward the working branch
        run: |
          git fetch origin "$WORKING_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$(git rev-parse "$GITHUB_SHA")"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release exists; refusing to replace immutable assets' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" /tmp/segmented32-release/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false --title 'Experimental segmented memory policies dev40' --notes-file docs/acceptance/2026-11-21-segment-strategies-release.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add multigpubfs/native_assets.json pyproject.toml docs/install-native-package.md docs/experimental-memory-backends.md
          git commit -m 'Publish segmented VRAM dev40 native component index'
          git push origin "HEAD:refs/heads/$WORKING_BRANCH"
