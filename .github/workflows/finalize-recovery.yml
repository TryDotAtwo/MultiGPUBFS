name: Attach installed dev35 acceptance
on:
  workflow_dispatch:
  push:
    branches: [codex/integrated-bfs-best-practices-delivery]
    paths: [.github/workflows/finalize-recovery.yml]
permissions:
  contents: read
jobs:
  publish-evidence:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify acceptance and publish metadata only
        run: |
          python3 -c "import json; r=json.load(open('docs/acceptance/recovery-dev35-installed.json')); assert r['status']=='READY' and r['recovery']=='READY' and r['devices']==[0,1] and r['execution']['returncode']==0 and r['setup']['generated_example_verified'] and r['execution']['prefetch_returncode']==0"
          gh release upload native-pip-20261025-v35 docs/acceptance/recovery-dev35-installed.json --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit native-pip-20261025-v35 --repo "$GITHUB_REPOSITORY" --notes-file docs/acceptance/recovery-dev35.md
