name: Package native pip wheel
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub release tag for the verified packaging candidate
        required: true
        default: native-pip-20261013
      reuse_release:
        description: Optional immutable portable native release (Python-only repack)
        required: false
        default: ""
      reuse_package_run:
        description: Optional successful package-native Actions run (Python-only repack)
        required: false
        default: ""
permissions:
  contents: read
  actions: read
jobs:
  package:
    runs-on: ubuntu-22.04
    # Match the native components build. Compiling the universal CUDA library
    # can take more than 45 minutes before wheel assembly and installation.
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare packaging tools
        env:
          REUSE_RELEASE: ${{ inputs.reuse_release }}
          REUSE_RUN: ${{ inputs.reuse_package_run }}
        run: |
          if [[ -n "$REUSE_RELEASE" && -n "$REUSE_RUN" ]]; then
            echo "Choose one packaging input."
            exit 1
          fi
          if [[ -z "$REUSE_RUN" ]]; then
            sudo apt-get update -qq
            sudo apt-get install -y patchelf cmake ninja-build g++
            rustup toolchain install 1.75.0 --profile minimal
            python3 -m pip install build wheel
          else
            python3 -m pip install wheel
          fi
      - name: Check private runtime contracts
        run: python3 -m unittest discover -s tests -p test_private_runtime_distribution.py
      - name: Check certified workload bounds
        run: python3 -m unittest discover -s tests -p test_workload_geometry.py
      - name: Check diagnostic failure and timeout contracts
        run: python3 -m unittest discover -s tests -p test_diagnostics.py
      - name: Check driver evidence classification
        run: python3 -m unittest discover -s tests -p test_driver_diagnostics.py
      - name: Check extended diagnostic evidence contracts
        run: python3 -m unittest discover -s tests -p test_extended_diagnostics.py
      - name: Build portable native binaries on Ubuntu 22.04
        if: inputs.reuse_release == '' && inputs.reuse_package_run == ''
        run: python3 scripts/build_portable_native.py
      - name: Reuse checked portable native artifacts for Python-only updates
        if: inputs.reuse_release != ''
        env:
          REUSE_RELEASE: ${{ inputs.reuse_release }}
        run: python3 scripts/reuse_portable_native.py "$REUSE_RELEASE"
      - name: Repack a checked Actions wheel with unchanged native parts
        shell: bash
        if: inputs.reuse_package_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE_RUN: ${{ inputs.reuse_package_run }}
        run: |
          [[ "$REUSE_RUN" =~ ^[0-9]+$ ]]
          source="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REUSE_RUN" |
            jq -er --arg repo "$GITHUB_REPOSITORY" '
              select(.path == ".github/workflows/package-native.yml" and .conclusion == "success"
                     and .head_repository.full_name == $repo)
              | .head_sha | select(test("^[0-9a-f]{40}$"))
            ')"
          if ! git cat-file -e "$source^{commit}"; then
            git fetch --no-tags --depth=1 origin "$source"
          fi
          if ! git diff --quiet "$source" HEAD -- Cargo.toml Cargo.lock crates cuda; then
            echo "Native sources changed since the package run."
            exit 1
          fi
          gh run download "$REUSE_RUN" --repo "$GITHUB_REPOSITORY" --name native-pip-wheel \
            --dir "$RUNNER_TEMP/mgbfs-package-source"
          python3 scripts/reuse_portable_native.py --artifact-dir "$RUNNER_TEMP/mgbfs-package-source" \
            --source "$source" --output dist-native
      - name: Assemble wheel with private redistributables
        if: inputs.reuse_package_run == ''
        run: |
          python3 scripts/package_github_wheel.py --output dist-native \
            --binary /tmp/mgbfs-portable/target/release/mgbfs \
            --library /tmp/mgbfs-portable/native-build/libmgbfs_cuda.so \
            --native-manifest /tmp/mgbfs-portable/native-manifest.json
      - name: Test clean Linux pip install without setup script
        env:
          REQUIRE_SEGMENTED_ABI: ${{ inputs.reuse_release == '' && '1' || '0' }}
        run: |
          python3 -m venv /tmp/pip-native-clean
          /tmp/pip-native-clean/bin/python -m pip install dist-native/*.whl
          cd /tmp
          /tmp/pip-native-clean/bin/python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          from multigpubfs.native_distribution import native_runtime
          native, env = native_runtime()
          assert os.access(native, os.X_OK), 'Wheel must preserve executable permissions'
          assert Path(native).is_relative_to(Path('/tmp/pip-native-clean'))
          root=Path(native).parents[1]
          manifest=json.loads((root/'manifest.json').read_text())
          assert manifest['bundled_runtime']
          assert manifest['package_source_commit'] == os.environ['GITHUB_SHA']
          package = json.loads((root.parent/'_package_info.json').read_text())
          assert package['source_commit'] == os.environ['GITHUB_SHA']
          result=subprocess.run(['ldd',native],env=env,text=True,capture_output=True,check=True)
          missing=[line for line in result.stdout.splitlines() if 'not found' in line and 'libcuda.so.1' not in line]
          assert not missing, missing
          assert '/tmp/pip-native-clean/' in result.stdout
          if os.environ['REQUIRE_SEGMENTED_ABI'] == '1':
              library=root/'lib/libmgbfs_cuda.so'
              assert any(line.split()[:3] == ['libmgbfs_cuda.so', '=>', str(library)]
                         for line in result.stdout.splitlines()), result.stdout
              capabilities=json.loads(subprocess.check_output([native, 'key-info'], env=env, text=True))
              assert capabilities['schema'] == 1
              required=(
                  'bitmap_pack4_experimental_v1',
                  'bitmap_pack4_adaptive_v2',
                  'permutation_bitmap_v1',
                  'segmented_memory_presets_v1',
                  'segmented_packet_transport_v1',
                  'graph_path_segmented_nearest_v1',
                  'graph_path_segmented_nearest_bidirectional_v1',
                  'graph_path_segmented_window_v1',
                  'graph_path_segmented_window_bidirectional_v1',
              )
              missing=[key for key in required if capabilities.get(key) is not True]
              assert not missing, (missing, capabilities)
          print(result.stdout)
          print('VERIFIED_CLEAN_LINUX_PIP_INSTALL_NO_GPU')
          PY
          /tmp/pip-native-clean/bin/python -m pip check
      - name: Preserve wheel and build receipts in GitHub Actions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-pip-wheel
          path: dist-native/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
