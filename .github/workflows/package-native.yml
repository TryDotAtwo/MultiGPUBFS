name: Package native pip wheel
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub release tag for the verified packaging candidate
        required: true
        default: native-pip-20261013
      reuse_release:
        description: Optional immutable portable native release (Python-only repack)
        required: false
        default: ""
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare packaging tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y patchelf cmake ninja-build g++
          rustup toolchain install 1.75.0 --profile minimal
          python3 -m pip install build wheel
      - name: Check private runtime contracts
        run: python3 -m unittest discover -s tests -p test_private_runtime_distribution.py
      - name: Check certified workload bounds
        run: python3 -m unittest discover -s tests -p test_workload_geometry.py
      - name: Build portable native binaries on Ubuntu 22.04
        if: inputs.reuse_release == ''
        run: python3 scripts/build_portable_native.py
      - name: Reuse checked portable native artifacts for Python-only updates
        if: inputs.reuse_release != ''
        env:
          REUSE_RELEASE: ${{ inputs.reuse_release }}
        run: python3 scripts/reuse_portable_native.py "$REUSE_RELEASE"
      - name: Assemble wheel with private redistributables
        run: |
          if [ -f /tmp/mgbfs-portable/native-manifest.json ]; then
            python3 scripts/package_github_wheel.py --output dist-native --binary /tmp/mgbfs-portable/target/release/mgbfs --library /tmp/mgbfs-portable/native-build/libmgbfs_cuda.so --native-manifest /tmp/mgbfs-portable/native-manifest.json
          else
            python3 scripts/package_github_wheel.py --output dist-native --binary /tmp/mgbfs-portable/target/release/mgbfs --library /tmp/mgbfs-portable/native-build/libmgbfs_cuda.so
          fi
      - name: Test clean Linux pip install without setup script
        run: |
          python3 -m venv /tmp/pip-native-clean
          /tmp/pip-native-clean/bin/python -m pip install dist-native/*.whl
          cd /tmp
          /tmp/pip-native-clean/bin/python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          from multigpubfs.native_distribution import native_runtime
          native, env = native_runtime()
          assert os.access(native, os.X_OK), 'Wheel must preserve executable permissions'
          assert Path(native).is_relative_to(Path('/tmp/pip-native-clean'))
          manifest=json.loads((Path(native).parents[1]/'manifest.json').read_text())
          assert manifest['bundled_runtime']
          result=subprocess.run(['ldd',native],env=env,text=True,capture_output=True,check=True)
          missing=[line for line in result.stdout.splitlines() if 'not found' in line and 'libcuda.so.1' not in line]
          assert not missing, missing
          assert '/tmp/pip-native-clean/' in result.stdout
          print(result.stdout)
          print('VERIFIED_CLEAN_LINUX_PIP_INSTALL_NO_GPU')
          PY
          /tmp/pip-native-clean/bin/python -m pip check
      - name: Preserve wheel and build receipts in GitHub Actions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-pip-wheel
          path: dist-native/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
