name: Publish recovery diagnostics dev34
on:
  workflow_dispatch:
  push:
    branches: [codex/integrated-bfs-best-practices-delivery]
    paths: [.github/workflows/publish-recovery.yml]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Test and package unchanged pinned native components
        run: |
          python3 -m pip install build pytest numpy packaging
          python3 -m pip install torch==2.9.0+cpu --index-url https://download.pytorch.org/whl/cpu
          python3 -m pip install git+https://github.com/cayleypy/cayleypy.git@3cd11ecefc98e54d6fc0ccdec967d0bcc8ca4a93
          PYTHONPATH=. python3 -m pytest -q tests/test_recovery_registry.py tests/test_recovery_diagnostics.py tests/test_cayleypy_backend.py tests/test_nccl_preflight.py tests/test_unlimited_and_stale.py
          PYTHONPATH=. python3 -m scripts.build_lazy_native_package
          cp docs/acceptance/recovery-dev34.json dist-native/gpu-acceptance.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: recovery-dev34-release
          path: dist-native/*
      - name: Publish prerelease
        run: |
          gh release create native-pip-20261025-v34 dist-native/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false --title 'dev34: automatic verified recovery profiles for CayleyPy persistent sessions' --notes-file docs/acceptance/recovery-dev34.md
