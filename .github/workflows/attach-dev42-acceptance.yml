name: Attach dev42 GPU acceptance evidence
on:
  push:
    branches: [codex/segmented-dev41-candidate]
    paths: [.github/workflows/attach-dev42-acceptance.yml]
permissions:
  contents: write
jobs:
  attach:
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: native-pip-20261122-v42
    steps:
      - name: Attach verified evidence and link report
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/454004861" > "$RUNNER_TEMP/before.json"
          python - "$RUNNER_TEMP/before.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          assert not r["draft"] and r["prerelease"] and r["tag_name"]=="native-pip-20261122-v42"
          assert r["target_commitish"]=="3e2df9d7325694144d4c3c46acc6089817bfcf02"
          wheel=next(a for a in r["assets"] if a["name"]=="multigpubfs-0.2.0.dev42-py3-none-any.whl")
          assert wheel["digest"]=="sha256:2ba8d7bd644b7f3cf0afc30c1b503cc6518493b8d7701a2f026991339d02a204"
          PY
          gh api "repos/$GITHUB_REPOSITORY/contents/docs/acceptance/artifacts/2026-11-22-dev42-8gpu.json?ref=970e683bd817b644f8980c28de55858d68259fbb" --jq .content | base64 --decode > "$RUNNER_TEMP/acceptance-8gpu.json"
          gh release upload "$TAG" "$RUNNER_TEMP/acceptance-8gpu.json" --repo "$GITHUB_REPOSITORY" --clobber
          python - "$RUNNER_TEMP/before.json" "$RUNNER_TEMP/body.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          marker="### Eight-GPU acceptance evidence"
          text=marker+"\n\n[Report, measurements and limitations](https://github.com/TryDotAtwo/MultiGPUBFS/blob/970e683bd817b644f8980c28de55858d68259fbb/docs/acceptance/2026-11-22-dev42-8gpu.md). The attached acceptance-8gpu.json records the subsequent GPU acceptance. The existing manifest.json records the earlier build stage.\n"
          body=r["body"] or ""
          if marker not in body: body=body.rstrip()+"\n\n"+text
          json.dump({"body":body},open(sys.argv[2],"w"))
          PY
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/454004861" --input "$RUNNER_TEMP/body.json" --silent
          gh api "repos/$GITHUB_REPOSITORY/releases/454004861" > "$RUNNER_TEMP/after.json"
          python - "$RUNNER_TEMP/acceptance-8gpu.json" "$RUNNER_TEMP/after.json" <<'PY'
          import hashlib,json,sys
          data=open(sys.argv[1],"rb").read()
          r=json.load(open(sys.argv[2]))
          asset=next(a for a in r["assets"] if a["name"]=="acceptance-8gpu.json")
          assert asset["size"]==len(data) and asset["digest"]=="sha256:"+hashlib.sha256(data).hexdigest()
          assert "### Eight-GPU acceptance evidence" in r["body"]
          assert not r["draft"] and r["prerelease"]
          print("RELEASE_ACCEPTANCE_ASSET_VERIFIED")
          PY
