name: Publish measured NCCL preflight dev32
on:
  workflow_dispatch:
  push:
    branches: [codex/integrated-bfs-best-practices-delivery]
    paths: [.github/workflows/publish-nccl-preflight.yml]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Test and package unchanged pinned native components
        run: |
          python3 -m pip install build pytest numpy packaging
          PYTHONPATH=. python3 -m pytest -q tests/test_nccl_preflight.py tests/test_unlimited_and_stale.py
          PYTHONPATH=. python3 -m scripts.build_lazy_native_package
          cp docs/acceptance/nccl-dev32.json dist-native/gpu-acceptance.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nccl-dev32-release
          path: dist-native/*
      - name: Publish prerelease
        run: |
          gh release create native-pip-20261021-v32 dist-native/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false --title 'dev32: measured NCCL reserve and verified startup transport' --notes-file docs/acceptance/nccl-dev32.md
