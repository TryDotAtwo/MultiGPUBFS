name: Build integrated dev41 candidate
on:
  push:
    branches: [codex/segmented-dev41-candidate]
    paths: [.github/workflows/build-integrated-dev41-candidate.yml]
permissions:
  contents: read
  actions: read
jobs:
  source-staging:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Pack and independently verify source payload
        run: |
          set -euo pipefail
          git archive --format=tar -o "$RUNNER_TEMP/source.tar" "$GITHUB_SHA"
          python3 - "$RUNNER_TEMP/source.tar" <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import subprocess
          import sys
          import tarfile
          import tempfile

          source = Path.cwd()
          prefixes = ('cuda/', 'crates/', 'rust/', 'multigpubfs/', 'scripts/',
                      'tests/', 'kaggle/library-owner/', 'kaggle/native-primitives/')
          roots = {'Cargo.toml', 'Cargo.lock', 'pyproject.toml', 'setup.py'}
          raw = subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0')
          names = [os.fsdecode(x) for x in raw if x]
          tracked = [name for name in names if name in roots or name.startswith(prefixes)]
          tracked = [name for name in tracked if (source / name).is_file()
                     and not (source / name).is_symlink()]
          required = {'Cargo.toml', 'Cargo.lock', 'pyproject.toml', 'setup.py',
                      'cuda/CMakeLists.txt', 'cuda/segmented_history.cu',
                      'scripts/build_portable_native.py',
                      'multigpubfs/native_assets.py',
                      'tests/segmented_strategy_layers_gpu.py'}
          if len(tracked) < 100 or not required.issubset(tracked):
              raise RuntimeError('SOURCE_TRACKED_INVENTORY')
          def digest(path):
              return hashlib.sha256(path.read_bytes()).digest()
          def verify(stage):
              for name in tracked:
                  staged = stage / name
                  if not staged.is_file():
                      raise RuntimeError('SOURCE_STAGED_MISSING ' + name)
                  if digest(source / name) != digest(staged):
                      raise RuntimeError('SOURCE_STAGED_HASH ' + name)
          with tempfile.TemporaryDirectory(prefix='mgbfs-staging-') as tmp:
              stage = Path(tmp)
              with tarfile.open(sys.argv[1], 'r:') as archive:
                  archive.extractall(stage)
              verify(stage)
              fixture = stage / 'cuda/segmented_history.cu'
              original = fixture.read_bytes()
              fixture.unlink()
              try:
                  verify(stage)
              except RuntimeError as error:
                  if str(error) != 'SOURCE_STAGED_MISSING cuda/segmented_history.cu':
                      raise
              else:
                  raise RuntimeError('SOURCE_MISSING_FIXTURE_NOT_REJECTED')
              fixture.write_bytes(original)
              verify(stage)
          print('SOURCE_STAGING_PASS files=' + str(len(tracked)))
          print('SOURCE_MISSING_FIXTURE_REJECTED')
          PY
          cd "$RUNNER_TEMP"
          sha256sum source.tar > source.sha256
          git -C "$GITHUB_WORKSPACE" rev-parse HEAD > source.commit
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: integrated-dev41-source-staging
          path: |
            ${{ runner.temp }}/source.tar
            ${{ runner.temp }}/source.sha256
            ${{ runner.temp }}/source.commit
          if-no-files-found: error
          compression-level: 6
          retention-days: 7

  compile:
    needs: source-staging
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        sm: ["75", "80", "86", "89", "90", "100", "103", "120", "universal"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build g++ binutils
          python3 -m pip install packaging numpy
      - name: Verify target selection
        run: python3 -m unittest discover -s tests -p test_selective_build_diagnostics.py
      - name: Build source-pinned CUDA component
        env:
          MGBFS_DIAGNOSTIC_VARIANT: shared-sm120
          TARGET: ${{ matrix.sm }}
        run: |
          if [ "$TARGET" = universal ]; then
            unset MGBFS_TARGET_ARCH
          else
            export MGBFS_TARGET_ARCH="$TARGET"
          fi
          python3 scripts/build_portable_native.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: segmented-vram-sm${{ matrix.sm }}
          path: /tmp/mgbfs-portable/diagnostic-variant/shared-sm120/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
  package:
    needs: compile
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      MGBFS_COMPONENT_BUILD_SOURCE: ${{ github.sha }}
      RELEASE_TAG: native-pip-20261121-v41
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install package tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y patchelf binutils
          python -m pip install build pytest numpy packaging
          rustup toolchain install 1.75.0 --profile minimal
      - name: Check configuration and packaging contracts
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_vram_release.py tests/test_segmented32_release.py tests/test_experimental_backend_capability.py tests/test_launch_cli.py tests/test_memory_preset.py
          PYTHONPATH=. python -m pytest -q tests/test_segment_strategy.py
          PYTHONPATH=. python -m pytest -q tests/test_segmented_shard_policy.py -k 'not custom_segment_rows_forwarded and not tuner'
      - name: Download matching component artifacts and shared runtime
        run: |
          for sm in 75 80 86 89 90 100 103 120; do
            gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "segmented-vram-sm$sm" --dir "/tmp/components/sm$sm"
          done
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name segmented-vram-smuniversal --dir /tmp/components/universal
          curl --fail --silent --show-error --location --retry 3 -o /tmp/common.tar.gz https://github.com/TryDotAtwo/MultiGPUBFS/releases/download/native-pip-20261019-v31/common-dev31.tar.gz
          echo '7d44d15a64d3032974801321420fda50027ce3724dba4d6d316cb759ffcb2c99  /tmp/common.tar.gz' | sha256sum -c -
          mkdir /tmp/common
          tar -xzf /tmp/common.tar.gz -C /tmp/common
      - name: Build and verify matching native components
        run: |
          PYTHONPATH=. python scripts/build_segmented_cli.py --cuda-dir /tmp/components/sm86 --common-dir /tmp/common --receipt /tmp/cli-receipt.json
          python -c 'import json; c=json.load(open("/tmp/cli-receipt.json"))["capabilities"]["segmented_strategies_v1"]; assert all(c.get(x) is True for x in ("atomic","warp","batch"))'
          PYTHONPATH=. python scripts/assemble_segmented_release.py --builds /tmp/components --binary target/release/mgbfs --binary-receipt /tmp/cli-receipt.json --output /tmp/segmented32-release --work /tmp/segmented32-work --tag "$RELEASE_TAG"
      - name: Assemble wheel and pin instructions
        run: |
          cp /tmp/segmented32-release/native-assets.json multigpubfs/native_assets.json
          PYTHONPATH=. python -m scripts.build_lazy_native_package
          cp dist-native/*.whl /tmp/segmented32-release/
          cp dist-native/manifest.json /tmp/segmented32-release/wheel-manifest.json
          (cd /tmp/segmented32-release && sha256sum * > SHA256SUMS && sha256sum -c SHA256SUMS)
      - name: Check candidate wheel without GPU
        run: |
          python -m venv /tmp/check-wheel
          /tmp/check-wheel/bin/pip install --no-deps dist-native/multigpubfs-0.2.0.dev41-py3-none-any.whl
          cd /tmp
          /tmp/check-wheel/bin/python -m multigpubfs --help
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: segmented-vram-dev41-release
          path: /tmp/segmented32-release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
