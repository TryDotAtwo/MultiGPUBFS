name: Link verified dev41 usage and acceptance
on:
  push:
    branches: [codex/segmented-dev41-candidate]
    paths: [.github/workflows/link-dev41-usage.yml]
permissions:
  contents: write
jobs:
  link:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Append usage and public-install evidence to release notes
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/453935898" > "$RUNNER_TEMP/release.json"
          python3 - "$RUNNER_TEMP/release.json" "$RUNNER_TEMP/update.json" <<'PY'
          import json,pathlib,sys
          d=json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert d['tag_name']=='native-pip-20261121-v41' and not d['draft'] and d['prerelease']
          marker='Installation, offline prefetch and CayleyPy example'
          body=d['body']
          if marker not in body:
              body+='\n\n[Installation, offline prefetch and CayleyPy example](https://github.com/TryDotAtwo/MultiGPUBFS/blob/d4f6b6c5c9dfdea4b99eb95bd3a1cbd171a6adcc/docs/experimental-segmented.md). [Public installation and GPU acceptance results](https://github.com/TryDotAtwo/MultiGPUBFS/blob/d4f6b6c5c9dfdea4b99eb95bd3a1cbd171a6adcc/docs/acceptance/2026-11-21-dev41-package-sm86.md).\n'
          pathlib.Path(sys.argv[2]).write_text(json.dumps({'body':body}))
          PY
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/453935898" --input "$RUNNER_TEMP/update.json" > "$RUNNER_TEMP/updated.json"
          python3 - "$RUNNER_TEMP/updated.json" <<'PY'
          import json,pathlib,sys
          d=json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert not d['draft'] and d['prerelease'] and 'Installation, offline prefetch and CayleyPy example' in d['body']
          print('RELEASE_USAGE_LINKS_PASS')
          PY
