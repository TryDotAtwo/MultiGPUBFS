name: Publish experimental segmented-memory dev36
on:
  workflow_dispatch:
  push:
    branches: [codex/integrated-bfs-best-practices-delivery]
    paths: [.github/workflows/publish-segmented-dev36.yml]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_RUN: '44599038300'
      BUILD_SOURCE: '684cdc36f477fa84bf5181cd84d25d56acc78b2e'
      RELEASE_TAG: native-pip-20261119-v36
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install CPU build and test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y patchelf binutils
          python -m pip install build pytest numpy packaging
          rustup toolchain install 1.75.0 --profile minimal
      - name: Check component and diagnostic contracts
        run: |
          PYTHONPATH=.:tests python -m pytest -q tests/test_separate_executable_component.py tests/test_optional_diagnostic_controls.py tests/test_native_prefetch_diagnostics.py tests/test_native_assets_diagnostics.py tests/test_runtime_variant_diagnostics.py tests/test_launch_cli.py
      - name: Fetch exact source-pinned builds and reused runtime
        run: |
          test "$(gh run view "$BUILD_RUN" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" = success
          test "$(gh run view "$BUILD_RUN" --repo "$GITHUB_REPOSITORY" --json headSha --jq .headSha)" = "$BUILD_SOURCE"
          for sm in 75 80 86 89 90 100 103 120; do
            gh run download "$BUILD_RUN" --repo "$GITHUB_REPOSITORY" --name "native-component-sm$sm" --dir "/tmp/components/sm$sm"
          done
          gh run download "$BUILD_RUN" --repo "$GITHUB_REPOSITORY" --name native-component-smuniversal --dir /tmp/components/universal
          curl --fail --silent --show-error --location --retry 3 -o /tmp/common.tar.gz https://github.com/TryDotAtwo/MultiGPUBFS/releases/download/native-pip-20261019-v31/common-dev31.tar.gz
          echo '7d44d15a64d3032974801321420fda50027ce3724dba4d6d316cb759ffcb2c99  /tmp/common.tar.gz' | sha256sum -c -
          mkdir /tmp/common
          tar -xzf /tmp/common.tar.gz -C /tmp/common
      - name: Build matching CLI and assemble all native components
        run: |
          PYTHONPATH=. python scripts/build_segmented_cli.py --cuda-dir /tmp/components/sm86 --common-dir /tmp/common --receipt /tmp/cli-receipt.json
          PYTHONPATH=. python scripts/assemble_segmented_release.py --builds /tmp/components --binary target/release/mgbfs --binary-receipt /tmp/cli-receipt.json --output /tmp/segmented-release --work /tmp/segmented-release-work --tag "$RELEASE_TAG"
      - name: Assemble wheel and exact installation instructions
        run: |
          cp /tmp/segmented-release/native-assets.json multigpubfs/native_assets.json
          python -c "from pathlib import Path; p=Path('pyproject.toml'); s=p.read_text(); a='version = \"0.2.0.dev35\"'; assert s.count(a)==1; p.write_text(s.replace(a, 'version = \"0.2.0.dev36\"'))"
          PYTHONPATH=. python -m scripts.build_lazy_native_package
          cp dist-native/*.whl /tmp/segmented-release/
          cp dist-native/manifest.json /tmp/segmented-release/wheel-manifest.json
          python scripts/finalize_segmented_release.py --wheel dist-native/multigpubfs-0.2.0.dev36-py3-none-any.whl
          cd /tmp/segmented-release
          sha256sum * > SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: segmented-dev36-release
          path: /tmp/segmented-release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Publish prerelease and update single working branch
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; do not overwrite immutable assets." >&2
            exit 1
          fi
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          gh release create "$RELEASE_TAG" /tmp/segmented-release/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false --title 'Experimental segmented and bitmap BFS dev36' --notes-file docs/acceptance/segmented-release-dev36.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add multigpubfs/native_assets.json pyproject.toml docs/install-native-package.md docs/experimental-memory-backends.md
          git commit -m 'Publish segmented dev36 native component index'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
