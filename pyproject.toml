[build-system]
requires = ["setuptools>=68", "wheel>=0.41"]
build-backend = "setuptools.build_meta"

[project]
name = "multigpubfs"
version = "0.2.0.dev23"
description = "Exact native GPU BFS for CayleyPy graph actions"
requires-python = ">=3.10"

[project.scripts]
multigpubfs = "multigpubfs.cli:main"

[project.optional-dependencies]
cayleypy = ["cayleypy==0.2.0"]

[tool.setuptools.packages.find]
include = ["multigpubfs", "multigpubfs.*"]

[tool.setuptools.package-data]
multigpubfs = ["native_assets.json", "_package_info.json", "_native/bin/*", "_native/lib/*", "_native/manifest.json", "_native/licenses/*", "_native/diagnostic_variants/variants.json", "_native/diagnostic_variants/*/*", "third_party/*.txt"]
