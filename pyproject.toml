[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multigpubfs"
version = "0.2.0.dev0"
description = "Exact native GPU BFS for CayleyPy graph actions"
requires-python = ">=3.10"

[project.optional-dependencies]
cayleypy = ["cayleypy"]

[tool.setuptools.packages.find]
include = ["multigpubfs", "multigpubfs.*"]
